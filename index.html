
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator App</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #111827, #263449);
    font-family: Arial, sans-serif;
}

.calculator {
    width: 360px;
    max-width: 100%;
    padding: 22px;
    background: #171c25;
    border: 1px solid #394454;
    border-radius: 28px;
    box-shadow: 0 25px 60px #0008;
}

.display {
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    padding: 16px 8px 24px;
    margin-bottom: 20px;
    color: white;
    overflow: hidden;
}

.previous {
    min-height: 24px;
    color: #9ca3af;
    font-size: 15px;
    overflow-wrap: anywhere;
}

.current {
    width: 100%;
    text-align: right;
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 300;
    overflow-wrap: anywhere;
}

.keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    min-width: 0;
    height: 58px;
    border: 1px solid #414b5a;
    border-radius: 17px;
    background: #29313e;
    color: #f9fafb;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 6px #0004;
    transition: transform .08s, filter .1s;
}

button:active {
    transform: scale(.94);
    filter: brightness(1.3);
}

button.function {
    background: #414958;
    color: #e5e7eb;
}

button.operator {
    background: #ff851b;
    color: white;
    border-color: #ff9c43;
}

button.zero {
    grid-column: span 2;
}

button:hover { filter: brightness(1.15); }

footer {
    text-align: center;
    color: #8993a3;
    font-size: 12px;
    padding-top: 18px;
}
</style>
</head>

<body>
<main class="calculator">
    <section class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </section>

    <section class="keys">
        <button class="function" onclick="clearDisplay()">AC</button>
        <button class="function" onclick="backspace()">⌫</button>
        <button class="function" onclick="addSymbol('(')">(</button>
        <button class="function" onclick="addSymbol(')')">)</button>

        <button class="function" onclick="percent()">%</button>
        <button class="function" onclick="addSymbol('^')">xʸ</button>
        <button class="operator" onclick="addSymbol('/')">÷</button>
        <button class="operator" onclick="addSymbol('*')">×</button>

        <button onclick="digit('7')">7</button>
        <button onclick="digit('8')">8</button>
        <button onclick="digit('9')">9</button>
        <button class="operator" onclick="addSymbol('-')">−</button>

        <button onclick="digit('4')">4</button>
        <button onclick="digit('5')">5</button>
        <button onclick="digit('6')">6</button>
        <button class="operator" onclick="addSymbol('+')">+</button>

        <button onclick="digit('1')">1</button>
        <button onclick="digit('2')">2</button>
        <button onclick="digit('3')">3</button>
        <button class="operator" onclick="calculate()">=</button>

        <button class="zero" onclick="digit('0')">0</button>
        <button onclick="decimal()">.</button>
        <button class="function" onclick="clearDisplay()">C</button>
    </section>

    <footer>BODMAS CALCULATOR</footer>
</main>

<script>
let expression = "";
let finished = false;

const display = document.getElementById("current");
const previous = document.getElementById("previous");

function render() {
    display.textContent = expression || "0";
}

function digit(n) {
    if (expression === "Error" || finished) {
        expression = "";
        finished = false;
    }

    expression += n;
    render();
}

function decimal() {
    if (expression === "Error" || finished) {
        expression = "";
        finished = false;
    }

    // Find the current number and avoid duplicate decimal points.
    const part = expression.split(/[+\-*/^()%]/).pop();

    if (!part.includes(".")) {
        if (part === "") expression += "0";
        expression += ".";
    }

    render();
}

function addSymbol(symbol) {
    if (expression === "Error") return;

    if (finished) {
        if ("+-*/^".includes(symbol)) {
            finished = false;
        } else {
            expression = "";
            finished = false;
        }
    }

    const last = expression.slice(-1);

    if ("+-*/^".includes(symbol)) {
        if (expression === "" && symbol !== "-") return;

        if ("+-*/^".includes(last)) {
            // Allow a negative number, such as 5 × -2.
            if (symbol === "-" && last !== "-") {
                expression += symbol;
            } else if (expression.length > 1 &&
                       "+-*/^".includes(expression.slice(-2, -1))) {
                expression = expression.slice(0, -1) + symbol;
            } else if (symbol !== "-" || last === "-") {
                expression = expression.slice(0, -1) + symbol;
            }
        } else {
            expression += symbol;
        }
    } else if (symbol === "(") {
        expression += symbol;
    } else if (symbol === ")") {
        if (expression && !"+-*/^(".includes(last)) {
            expression += symbol;
        }
    }

    render();
}

function percent() {
    if (!expression || expression === "Error") return;

    // A percentage is treated as division by 100.
    if (/[0-9)]$/.test(expression)) {
        expression += "%";
    }

    render();
}

// A small expression parser applies normal mathematical precedence.
// It does not execute arbitrary JavaScript code.
function evaluate(source) {
    const tokens = source.match(
        /\d*\.?\d+(?:e[+-]?\d+)?|[()+\-*/^%]/gi
    );

    if (!tokens) throw new Error("Invalid expression");

    const joined = tokens.join("");
    if (joined !== source.replace(/\s/g, "")) {
        throw new Error("Invalid expression");
    }

    let pos = 0;

    function peek() {
        return tokens[pos];
    }

    function take() {
        return tokens[pos++];
    }

    function primary() {
        const token = take();

        if (token === "(") {
            const value = addSub();
            if (take() !== ")") throw new Error("Missing bracket");
            return value;
        }

        if (token === undefined || !/^\d*\.?\d+(?:e[+-]?\d+)?$/i.test(token)) {
            throw new Error("Invalid number");
        }

        return Number(token);
    }

    function power() {
        let value = primary();

        // Exponents are evaluated from right to left.
        if (peek() === "^") {
            take();
            value = Math.pow(value, unary());
        }

        // Percent works as a postfix operator: 50% = 0.5.
        while (peek() === "%") {
            take();
            value /= 100;
        }

        return value;
    }

    function unary() {
        if (peek() === "+") {
            take();
            return unary();
        }

        if (peek() === "-") {
            take();
            return -unary();
        }

        return power();
    }

    function mulDiv() {
        let value = unary();

        while (peek() === "*" || peek() === "/") {
            const op = take();
            const right = unary();

            if (op === "/" && right === 0) {
                throw new Error("Cannot divide by zero");
            }

            value = op === "*" ? value * right : value / right;
        }

        return value;
    }

    function addSub() {
        let value = mulDiv();

        while (peek() === "+" || peek() === "-") {
            const op = take();
            const right = mulDiv();
            value = op === "+" ? value + right : value - right;
        }

        return value;
    }

    const result = addSub();

    if (pos !== tokens.length || !Number.isFinite(result)) {
        throw new Error("Invalid expression");
    }

    return result;
}

function calculate() {
    if (!expression || expression === "Error") return;

    const original = expression;

    try {
        // Allow a trailing decimal point, such as 5.
        const result = evaluate(expression);
        expression = String(Number(result.toPrecision(10)));
        previous.textContent = original.replace(/\*/g, "×")
            .replace(/\//g, "÷") + " =";
        finished = true;
    } catch (error) {
        previous.textContent = error.message || "Invalid expression";
        expression = "Error";
        finished = true;
    }

    render();
}

function clearDisplay() {
    expression = "";
    finished = false;
    previous.textContent = "";
    render();
}

function backspace() {
    if (finished || expression === "Error") {
        expression = "";
        finished = false;
    } else {
        expression = expression.slice(0, -1);
    }

    render();
}

document.addEventListener("keydown", event => {
    if (/^[0-9]$/.test(event.key)) digit(event.key);
    else if (event.key === ".") decimal();
    else if (["+", "-", "*", "/", "^", "(", ")"].includes(event.key)) {
        addSymbol(event.key);
    }
    else if (event.key === "%") percent();
    else if (event.key === "Enter" || event.key === "=") calculate();
    else if (event.key === "Backspace") backspace();
    else if (event.key === "Escape") clearDisplay();
});
</script>
</body>
</html>
